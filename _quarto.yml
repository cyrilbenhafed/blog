project:
  type: website
  output-dir: _site

website:
  title: "Cyril Benhafed"
  description: "ML Engineer — Articles, projets et notes sur la data en production."
  site-url: https://blog.benhafed.com
  favicon: assets/favicon-vitrine.svg

  navbar:
    logo-href: https://benhafed.com
    left:
      - text: "Blog"
        href: index.qmd
      - text: "Articles"
        href: articles/index.qmd
      - text: "Projets"
        href: projets/index.qmd
      - text: "Reviews"
        href: reviews/index.qmd
      - text: "Notes"
        href: notes/index.qmd

  page-footer:
    left: "© 2026 Cyril Benhafed"
    right:
      - text: "benhafed.com"
        href: https://benhafed.com

  open-graph: true

format:
  html:
    theme:
      - flatly
      - custom.scss
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    highlight-style: github
    code-block-bg: true
    code-copy: true
    toc: true
    toc-depth: 3
    toc-title: "Sommaire"
    number-sections: false
    smooth-scroll: true
    link-external-newwindow: false
    link-external-icon: false

lang: fr
author: "Cyril Benhafed"

execute:
  freeze: auto
  cache: false
  warning: false
  message: false

jupyter: python3

language:
  title-block-author-single: "Par"